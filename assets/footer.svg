<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" aria-hidden="true">
  <style>
    /* même principe que banner.svg : vagues 2400 px, boucle sans saut */
    @keyframes flow { to { transform: translateX(-1200px); } }
    @keyframes flowBack { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
    .front { animation: flow 14s linear infinite; }
    .back { animation: flowBack 22s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .front, .back { animation: none; } }
  </style>
  <defs>
    <linearGradient id="footer-g" x1="0" x2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.5" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <clipPath id="footer-wave">
      <path class="front" d="M0 54Q150 18 300 54T600 54T900 54T1200 54T1500 54T1800 54T2100 54T2400 54V110H0Z"/>
    </clipPath>
  </defs>
  <path class="back" d="M0 34Q300 2 600 34T1200 34T1800 34T2400 34V110H0Z" fill="#FFF3C4"/>
  <rect width="1200" height="110" fill="url(#footer-g)" clip-path="url(#footer-wave)"/>
</svg>
